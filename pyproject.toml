[tool.ruff]
target-version = "py310"
# ``api/`` modules import each other flat (``from cache import cache``), so the
# directory must be on the source path for import-order classification to see
# them as first-party. The repo root covers ``ml``, ``tests``, ``benchmarks``.
src = [".", "api"]

[tool.ruff.lint]
select = [
    "E4",  # import placement
    "E7",  # statement formatting
    "E9",  # syntax / io errors
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade (modern syntax for the 3.10+ floor)
    "B",   # bugbear (likely-bug patterns)
]
ignore = [
    # FastAPI's dependency-injection idiom is a function call in a default
    # argument (``Query(...)``, ``Depends(...)``) — B008 flags every endpoint.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Two deliberate late-import blocks: the warnings filter must run before
# yfinance is imported (it emits on import), and route modules are imported
# after the v1 endpoints so the registration order is explicit.
"api/main.py" = ["E402"]

[tool.mypy]
# Target the active runtime. python-build-standalone ships 3.13; numpy 2.5+
# type stubs use PEP 695 ``type`` statements, so mypy must target >= 3.12.
python_version = "3.12"
files = ["api", "ml"]
# ``api/`` modules import each other flat (``from cache import cache``) rather
# than via the package path — these are executed with ``--app-dir api``. Put
# the directory on mypy's search path so the imports resolve the same way.
mypy_path = "api"
explicit_package_bases = true
namespace_packages = true

# Gradual strict — catch the highest-signal issues without drowning in
# third-party stubs that don't ship type info (yfinance, VADER, numba).
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = false     # Gradual: our own code is mostly typed, but
                                  # some legacy paths still use inferred types.
disallow_incomplete_defs = true

# Every call-site into an untyped third-party lib would otherwise error.
# We flip this per-module below, only for libs that truly lack stubs.
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "yfinance.*",
    "numba.*",
    "vaderSentiment.*",
    "sklearn.*",
    "pandas.*",
    "structlog.*",
    "transformers.*",
    "nltk.*",
    "praw.*",
    "aiohttp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Throwaway / exploratory scripts are exempt from the gradual strict rules.
module = [
    "ml.train_cli",
    "benchmarks.*",
    "scripts.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
# FastAPI route functions rely on framework introspection of Pydantic models
# for the response schema; annotating ``-> dict`` on every endpoint would
# lie about the actual response type, so we simply don't require return
# annotations on them. Middleware signatures include ``call_next`` which
# Starlette types internally as a private protocol.
module = [
    "main",
    "middleware",
    "routes.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
